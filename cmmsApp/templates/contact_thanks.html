<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thank you | iEtrack</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d2036;color:#fff}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 20%,#128e9360,transparent 42%);pointer-events:none}
    .cmms-contact-form-thanks{position:relative;width:min(100%,610px);padding:clamp(32px,6vw,64px);border:1px solid #ffffff25;border-radius:22px;background:#142d43;box-shadow:0 24px 70px #0004;text-align:center}
    .brand{display:inline-block;margin-bottom:32px;font-size:23px;font-weight:800;letter-spacing:-.055em}.brand span{color:#8fe3d0}
    .check{display:grid;place-items:center;width:70px;height:70px;margin:0 auto 23px;border-radius:50%;background:#8fe3d0;color:#0d3040;font-size:34px;font-weight:800}
    h1{margin:0 0 14px;font-size:clamp(30px,5vw,45px);letter-spacing:-.04em}
    p{max-width:440px;margin:0 auto 30px;color:#c0d5dc;font-size:16px;line-height:1.65}
    .cmms-contact-form-back{display:inline-block;padding:13px 22px;border-radius:9px;background:#8fe3d0;color:#0c2d39;font-weight:800;text-decoration:none;transition:background .2s}
    .cmms-contact-form-back:hover,.cmms-contact-form-back:focus-visible{background:#b8f3e3}
    .cmms-contact-form-back:focus-visible{outline:3px solid white;outline-offset:3px}
  </style>
</head>
<body>
  <main class="cmms-contact-form-thanks">
    <div class="brand" aria-label="iEtrack"><span>iE</span>track</div>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Thank you for reaching out.</h1>
    <p>We’ve received your iEtrack enquiry. Our team will review your message and get back to you using the contact details you provided.</p>
    <a href="/" class="cmms-contact-form-back">Return to iEtrack</a>
  </main>
</body>
</html>
